<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FWG Assistant Pilot</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head><body><main><h1>FWG Assistant</h1><p>Private voice pilot · one conversation at a time</p><section id="login"><label>Username<input id="username" autocomplete="username" value="owner"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="signin">Sign in</button></section><section id="workspace" hidden><p id="readiness">Checking models…</p><label>Mode<select id="mode"><option value="chat">General conversation</option><option value="status">Verified server status</option></select></label><label>Server<select id="server"></select></label><p>Server status mode checks the selected server. In conversation mode, say “Check Minecraft status” or “Restart Minecraft.” Restart requests need a separate confirmation.</p><button id="record">Record question</button><button id="stop" disabled>Stop and send</button><label>Or type a question<textarea id="text" rows="3" maxlength="2000"></textarea></label><button id="send">Send / check selected server</button><button id="logout">Sign out</button><div id="confirmation" hidden><p id="confirm-description"></p><button id="confirm-button">Confirm action</button><button id="cancel-button">Cancel</button></div><h2>Transcript</h2><p id="transcript"></p><h2>Answer</h2><p id="answer"></p><audio id="audio" controls></audio><p id="timings"></p></section><p id="message" role="status"></p></main></body></html>
